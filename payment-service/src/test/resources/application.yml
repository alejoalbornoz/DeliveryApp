spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    enabled: false

app:
  payment:
    base-url: http://localhost:8086

mercadopago:
  access-token: TEST-DUMMY-TOKEN-FOR-TESTS